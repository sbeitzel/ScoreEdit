<?xml version="1.0" encoding="UTF-8"?>
<!--
  ScoreEdit icon component: text cursor (I-beam with angled serifs)
  On a 1000x1000 canvas, vertically centered to match clef.svg / staff_lines.svg.
  Top serif is a 'v' chevron (apex pointing down, toward the stem).
  Bottom serif is a '^' chevron (apex pointing up, toward the stem).
  Stem runs from y=290 to y=690 (400 tall), centered on y=490.
-->
<svg width="1000" height="1000" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Text cursor with v and ^ serifs</title>
  <g fill="none" stroke="#04342C" stroke-width="36" stroke-linecap="round" stroke-linejoin="round">
    <!-- main stem -->
    <line x1="190" y1="290" x2="190" y2="690"/>
    <!-- top serif: 'v' shape, apex at the bottom -->
    <polyline points="120,250 190,290 260,250"/>
    <!-- bottom serif: '^' shape, apex at the top -->
    <polyline points="120,730 190,690 260,730"/>
  </g>
</svg>
