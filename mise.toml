[tools]
tuist = "latest"

[tasks.export_app_icon]
description = "Export the current app icon to the local website assets directory"
run = "scripts/export-app-icon.sh"

[tasks.bump_version]
description = "Bump the app version in VERSION.json (major|minor|patch|--set X.Y.Z|--build-only)"
run = "scripts/bump-version.sh"

[tasks.build_release]
description = "Build a Developer ID-signed Release build of the app into dist/build/export"
run = "scripts/build-release.sh"

[tasks.make_dmg_background]
description = "Regenerate the DMG window background art (dmg/background.{svg,png,tiff})"
run = "scripts/make-dmg-background.sh"

[tasks.create_dmg]
description = "Assemble, sign, notarize, and staple the distributable .dmg (--skip-notarize to skip)"
run = "scripts/create-dmg.sh"

[tasks.make_appcast]
description = "Generate/refresh the Sparkle appcast + delta updates for the notarized .dmg"
run = "scripts/make-appcast.sh"
